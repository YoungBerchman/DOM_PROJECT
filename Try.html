<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./Try.css" />
  </head>
  <body>
    <h1 id="heading">My name is praise</h1>
    <button id="btn">Change Color</button>

    <script>
      let head = document.getElementById("heading");
      let butt = document.getElementById("btn");

      //   butt.addEventListener("click", () => {
      //     head.classList.toggle("blue");
      //   });

      butt.addEventListener("click", () => {
        if (head.classList.contains("blue")) {
          head.classList.remove("blue");
          head.classList.add("red");
        } else {
          head.classList.add("blue");
          head.classList.remove("red");
        }
      });
    </script>
  </body>
</html>
